# =====================================================================
#  Default settings BUILT INTO THE ISO (GitHub Releases).
#
#  !! This repository is public - never put a real password here. !!
#
#  To use your own settings: flash the ISO with Rufus in "ISO Image mode",
#  then copy this file to the stick as   archprofiles\settings.conf
#  and edit it there. The copy on the stick always wins.
#  Format: KEY=value     Lines starting with # are comments.
# =====================================================================

# --- Where profiles and installer scripts come from ------------------
# "auto" = this repository and the branch the ISO was built from
REPO_URL=auto
REPO_BRANCH=auto
# Only for a PRIVATE repository (never in this file - only on the stick)
REPO_TOKEN=

# --- Profile ---------------------------------------------------------
# Empty = show the profile list. A name = always install that profile.
PROFILE=

# --- Target disk -----------------------------------------------------
TARGET_DISK=auto
CONFIRM_SECONDS=15

# --- User account ----------------------------------------------------
USERNAME=user
FULLNAME=User
# Default password - change it after the first login with: passwd
PASSWORD=changeme
AUTOLOGIN=no

# --- Language & region -----------------------------------------------
LOCALE=de_DE.UTF-8
KEYMAP=de-latin1
TIMEZONE=Europe/Berlin
MIRROR_COUNTRY=Germany

# --- System ----------------------------------------------------------
# {profile} {mac} {serial} {random} are replaced automatically
HOSTNAME=arch-{profile}-{mac}
DESKTOP=kde
KERNEL=linux

# --- Wi-Fi (only on the stick copy, if the PC has no network cable) ---
WIFI_SSID=
WIFI_PASSWORD=

# --- When finished: reboot or poweroff -------------------------------
FINISH_ACTION=reboot
